  ## Configure Terraform provider.tf
  This Terraform now defaults to store state on S3.  As such the ./provider.tf must both be configured with the S3 bucket and S3 bucket region you choose to store state in.
  If you don't have an explicit bucket for storing state you may use the same 'utility bucket' that is used in the TFVAR 's3_bucket_name' at the top-level of this repo.  
  Note you can't put variables in the provider backend config, which is why this note is here.


  ### Persistent Storage Deployment Example
  
  ```hcl
  {{ include "examples/storage.tf" }}
  ```
